name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']
        dependencies: ['highest']
        include:
          - php-version: '8.1'
            dependencies: 'lowest'

    name: PHP ${{ matrix.php-version }} - ${{ matrix.dependencies }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json
          coverage: xdebug

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php-version }}-${{ matrix.dependencies }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-version }}-${{ matrix.dependencies }}-

      - name: Install dependencies (highest)
        if: matrix.dependencies == 'highest'
        run: composer install --prefer-dist --no-progress

      - name: Install dependencies (lowest)
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-dist --no-progress

      - name: Run test suite
        run: composer test

      # Runs even when the suite above fails: a failing test is precisely the
      # signal Test Analytics needs to flag flaky and consistently broken tests.
      # phpunit.xml already writes this file via its <junit> logger.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: ./tests/results/junit.xml
          flags: php${{ matrix.php-version }}-${{ matrix.dependencies }}
          fail_ci_if_error: false

      - name: Run code style check
        run: composer cs-check

      - name: Run static analysis
        run: composer phpstan

      - name: Generate coverage report
        if: matrix.php-version == '8.1' && matrix.dependencies == 'highest'
        run: composer test-coverage

      - name: Upload coverage to Codecov
        if: matrix.php-version == '8.1' && matrix.dependencies == 'highest'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/clover.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    name: Security Check

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run security check
        run: composer audit